<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fairy Dragonfly Obstacle Course!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #1a0533 0%, #4a1259 30%, #7b2991 60%, #ff9ecd 100%);
            min-height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #game-canvas {
            display: block;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a0533 0%, #4a1259 30%, #7b2991 60%, #ff9ecd 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #start-screen h1 {
            color: #FFD700;
            font-size: 2.5em;
            text-shadow: 0 0 20px #FF69B4, 0 0 40px #FF69B4, 3px 3px 0px #8B008B;
            margin-bottom: 20px;
            text-align: center;
            animation: sparkle 2s ease infinite;
        }

        @keyframes sparkle {
            0%, 100% { text-shadow: 0 0 20px #FF69B4, 0 0 40px #FF69B4, 3px 3px 0px #8B008B; }
            50% { text-shadow: 0 0 30px #FFD700, 0 0 60px #FFD700, 3px 3px 0px #8B008B; }
        }

        #start-screen p {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #FFB6C1;
            text-align: center;
            padding: 0 20px;
        }

        .fairy-picker {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 600px;
            padding: 20px;
        }

        .fairy-option {
            width: 100px;
            height: 120px;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            border: 3px solid rgba(255,255,255,0.3);
        }

        .fairy-option:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.4);
            border-color: #FFD700;
        }

        .fairy-option canvas {
            width: 80px;
            height: 80px;
        }

        .fairy-option span {
            display: block;
            text-align: center;
            font-weight: bold;
            color: #FFF;
            font-size: 0.9em;
            text-shadow: 1px 1px 2px #000;
        }

        #score {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 1.5em;
            color: #FFD700;
            text-shadow: 2px 2px 0 #8B008B, 0 0 10px #FF69B4;
            z-index: 50;
        }

        #controls-hint {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1em;
            color: #FFF;
            text-shadow: 2px 2px 0 #8B008B;
            z-index: 50;
            background: rgba(75, 0, 130, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid #FF69B4;
        }

        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: none;
        }

        .mobile-btn {
            width: 70px;
            height: 70px;
            font-size: 2em;
            border: 3px solid #FF69B4;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.7);
            margin: 5px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .mobile-btn:active {
            background: rgba(255, 215, 0, 0.9);
            transform: scale(0.95);
        }

        .controls-row {
            display: flex;
            justify-content: center;
        }

        #magic-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            font-size: 2em;
            border: 3px solid #FFD700;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF69B4, #9400D3);
            color: white;
            cursor: pointer;
            z-index: 50;
            display: none;
            touch-action: manipulation;
        }

        @media (pointer: coarse) {
            #mobile-controls, #magic-btn {
                display: block;
            }
            #controls-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>Fairy Dragonfly<br>Obstacle Course!</h1>
        <p>Pick your fairy and dragonfly!</p>
        <div class="fairy-picker" id="fairy-picker">
            <!-- Fairies will be added by JS -->
        </div>
    </div>

    <canvas id="game-canvas"></canvas>
    <div id="score">Stars: 0 | Ramps: 0</div>
    <div id="controls-hint">Arrow keys to fly! Space for magic sparkles!</div>

    <div id="mobile-controls">
        <div class="controls-row">
            <button class="mobile-btn" data-key="up">↑</button>
        </div>
        <div class="controls-row">
            <button class="mobile-btn" data-key="left">←</button>
            <button class="mobile-btn" data-key="down">↓</button>
            <button class="mobile-btn" data-key="right">→</button>
        </div>
    </div>
    <button id="magic-btn">✨</button>

    <script>
        // Audio setup
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playMagic() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.1);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playCollect() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);

            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(523 * 2, audioCtx.currentTime);
            osc2.frequency.setValueAtTime(659 * 2, audioCtx.currentTime + 0.1);
            osc2.frequency.setValueAtTime(784 * 2, audioCtx.currentTime + 0.2);

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

            osc.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc2.start();
            osc.stop(audioCtx.currentTime + 0.35);
            osc2.stop(audioCtx.currentTime + 0.35);
        }

        function playRamp() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playWingFlap() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(200 + Math.random() * 100, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // Game setup
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const fairyTypes = [
            { name: 'Rose', fairyColor: '#FF69B4', wingColor: '#FFB6C1', dragonflyColor: '#FF1493', dragonflyWing: '#FF69B4' },
            { name: 'Bluebell', fairyColor: '#87CEEB', wingColor: '#B0E0E6', dragonflyColor: '#4169E1', dragonflyWing: '#87CEEB' },
            { name: 'Sunny', fairyColor: '#FFD700', wingColor: '#FFEC8B', dragonflyColor: '#FFA500', dragonflyWing: '#FFD700' },
            { name: 'Violet', fairyColor: '#DDA0DD', wingColor: '#E6E6FA', dragonflyColor: '#9400D3', dragonflyWing: '#DDA0DD' },
            { name: 'Mint', fairyColor: '#98FB98', wingColor: '#F0FFF0', dragonflyColor: '#32CD32', dragonflyWing: '#98FB98' },
            { name: 'Coral', fairyColor: '#FF7F50', wingColor: '#FFDAB9', dragonflyColor: '#FF6347', dragonflyWing: '#FFA07A' },
        ];

        let selectedFairy = null;
        let fairy = null;
        let stars = [];
        let ramps = [];
        let obstacles = [];
        let sparkles = [];
        let backgroundStars = [];
        let score = 0;
        let rampScore = 0;
        let keys = {};
        let wingTimer = 0;
        let worldOffset = 0;

        // Create background stars
        for (let i = 0; i < 100; i++) {
            backgroundStars.push({
                x: Math.random() * 3000,
                y: Math.random() * window.innerHeight * 0.7,
                size: Math.random() * 3 + 1,
                twinkle: Math.random() * Math.PI * 2
            });
        }

        // Create fairy picker
        const picker = document.getElementById('fairy-picker');
        fairyTypes.forEach((type, index) => {
            const option = document.createElement('div');
            option.className = 'fairy-option';

            const miniCanvas = document.createElement('canvas');
            miniCanvas.width = 80;
            miniCanvas.height = 80;
            const miniCtx = miniCanvas.getContext('2d');
            drawFairyOnDragonfly(miniCtx, 40, 45, type, 0.5, 0);

            const label = document.createElement('span');
            label.textContent = type.name;

            option.appendChild(miniCanvas);
            option.appendChild(label);
            option.addEventListener('click', () => startGame(index));
            picker.appendChild(option);
        });

        function drawDragonfly(ctx, x, y, colors, scale, wingPhase) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Wings (4 wings, animated)
            const wingAngle = Math.sin(wingPhase) * 0.3;

            ctx.fillStyle = colors.dragonflyWing;
            ctx.globalAlpha = 0.6;

            // Top left wing
            ctx.save();
            ctx.rotate(-0.3 + wingAngle);
            ctx.beginPath();
            ctx.ellipse(-30, -20, 40, 15, -0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Top right wing
            ctx.save();
            ctx.rotate(0.3 - wingAngle);
            ctx.beginPath();
            ctx.ellipse(30, -20, 40, 15, 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Bottom left wing
            ctx.save();
            ctx.rotate(-0.2 - wingAngle * 0.5);
            ctx.beginPath();
            ctx.ellipse(-25, 5, 35, 12, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Bottom right wing
            ctx.save();
            ctx.rotate(0.2 + wingAngle * 0.5);
            ctx.beginPath();
            ctx.ellipse(25, 5, 35, 12, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.globalAlpha = 1;

            // Body
            ctx.fillStyle = colors.dragonflyColor;
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // Tail (long segmented)
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.ellipse(0, 35 + i * 12, 6 - i * 0.7, 8, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Head
            ctx.beginPath();
            ctx.arc(0, -30, 10, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-6, -32, 5, 0, Math.PI * 2);
            ctx.arc(6, -32, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(-5, -33, 2, 0, Math.PI * 2);
            ctx.arc(7, -33, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawFairy(ctx, x, y, colors, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Fairy wings
            ctx.fillStyle = colors.wingColor;
            ctx.globalAlpha = 0.7;

            ctx.beginPath();
            ctx.ellipse(-12, -5, 15, 20, -0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(12, -5, 15, 20, 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = 1;

            // Dress
            ctx.fillStyle = colors.fairyColor;
            ctx.beginPath();
            ctx.moveTo(-10, 5);
            ctx.quadraticCurveTo(-15, 25, -8, 30);
            ctx.lineTo(8, 30);
            ctx.quadraticCurveTo(15, 25, 10, 5);
            ctx.closePath();
            ctx.fill();

            // Body
            ctx.fillStyle = '#FFDAB9';
            ctx.beginPath();
            ctx.ellipse(0, 0, 8, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.arc(0, -18, 10, 0, Math.PI * 2);
            ctx.fill();

            // Hair
            ctx.fillStyle = colors.fairyColor;
            ctx.beginPath();
            ctx.arc(0, -22, 10, Math.PI, 0, false);
            ctx.quadraticCurveTo(12, -15, 8, -5);
            ctx.quadraticCurveTo(0, -10, -8, -5);
            ctx.quadraticCurveTo(-12, -15, -10, -22);
            ctx.fill();

            // Face
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-4, -18, 2, 0, Math.PI * 2);
            ctx.arc(4, -18, 2, 0, Math.PI * 2);
            ctx.fill();

            // Smile
            ctx.strokeStyle = '#FF69B4';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, -15, 4, 0.2, Math.PI - 0.2);
            ctx.stroke();

            // Wand
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(15, 10);
            ctx.lineTo(25, -5);
            ctx.stroke();

            // Star on wand
            drawMiniStar(ctx, 27, -8, 6, '#FFD700');

            ctx.restore();
        }

        function drawMiniStar(ctx, x, y, size, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
                const innerAngle = angle + Math.PI / 5;
                if (i === 0) {
                    ctx.moveTo(Math.cos(angle) * size, Math.sin(angle) * size);
                } else {
                    ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
                }
                ctx.lineTo(Math.cos(innerAngle) * size * 0.4, Math.sin(innerAngle) * size * 0.4);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawFairyOnDragonfly(ctx, x, y, colors, scale, wingPhase) {
            drawDragonfly(ctx, x, y + 20, colors, scale, wingPhase);
            drawFairy(ctx, x, y - 25 * scale, colors, scale * 0.7);
        }

        function createObstacleCourse() {
            // Create ramps throughout the course
            const courseLength = 5000;

            for (let x = 400; x < courseLength; x += 300 + Math.random() * 400) {
                const rampType = Math.random();
                if (rampType < 0.4) {
                    // Up ramp
                    ramps.push({
                        x: x,
                        y: canvas.height - 150 - Math.random() * 200,
                        width: 150,
                        height: 80,
                        type: 'up',
                        color: `hsl(${Math.random() * 60 + 280}, 70%, 60%)`
                    });
                } else if (rampType < 0.7) {
                    // Down ramp
                    ramps.push({
                        x: x,
                        y: 100 + Math.random() * 150,
                        width: 150,
                        height: 80,
                        type: 'down',
                        color: `hsl(${Math.random() * 60 + 180}, 70%, 60%)`
                    });
                } else {
                    // Loop (represented as a ring)
                    ramps.push({
                        x: x,
                        y: canvas.height / 2 - 50 + Math.random() * 100,
                        width: 120,
                        height: 120,
                        type: 'ring',
                        color: `hsl(${Math.random() * 360}, 80%, 50%)`
                    });
                }
            }

            // Create floating obstacles (clouds, mushrooms)
            for (let x = 300; x < courseLength; x += 200 + Math.random() * 300) {
                obstacles.push({
                    x: x,
                    y: Math.random() * (canvas.height - 200) + 100,
                    size: 40 + Math.random() * 40,
                    type: Math.random() > 0.5 ? 'cloud' : 'mushroom'
                });
            }

            // Create collectible stars
            for (let x = 200; x < courseLength; x += 150 + Math.random() * 200) {
                stars.push({
                    x: x,
                    y: Math.random() * (canvas.height - 200) + 100,
                    size: 20,
                    rotation: Math.random() * Math.PI * 2,
                    collected: false
                });
            }
        }

        function startGame(fairyIndex) {
            initAudio();
            selectedFairy = fairyTypes[fairyIndex];
            document.getElementById('start-screen').style.display = 'none';

            fairy = {
                x: 150,
                y: canvas.height / 2,
                vx: 0,
                vy: 0,
                wingPhase: 0,
                boosting: false
            };

            createObstacleCourse();
            gameLoop();
        }

        function spawnSparkle(x, y, color) {
            for (let i = 0; i < 5; i++) {
                sparkles.push({
                    x: x + (Math.random() - 0.5) * 30,
                    y: y + (Math.random() - 0.5) * 30,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    size: 3 + Math.random() * 5,
                    life: 1,
                    color: color || `hsl(${Math.random() * 60 + 300}, 100%, 70%)`
                });
            }
        }

        function burstSparkles(x, y) {
            playMagic();
            for (let i = 0; i < 20; i++) {
                const angle = (i / 20) * Math.PI * 2;
                sparkles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * (3 + Math.random() * 3),
                    vy: Math.sin(angle) * (3 + Math.random() * 3),
                    size: 4 + Math.random() * 6,
                    life: 1,
                    color: `hsl(${Math.random() * 360}, 100%, 70%)`
                });
            }
        }

        function drawRamp(ramp, offset) {
            const x = ramp.x - offset;
            if (x < -200 || x > canvas.width + 200) return;

            ctx.save();
            ctx.translate(x, ramp.y);

            if (ramp.type === 'ring') {
                // Draw ring/hoop
                ctx.strokeStyle = ramp.color;
                ctx.lineWidth = 15;
                ctx.beginPath();
                ctx.ellipse(0, 0, ramp.width / 2, ramp.height / 2, 0, 0, Math.PI * 2);
                ctx.stroke();

                // Inner glow
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.ellipse(0, 0, ramp.width / 2, ramp.height / 2, 0, 0, Math.PI * 2);
                ctx.stroke();

                // Sparkle decorations
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const px = Math.cos(angle) * ramp.width / 2;
                    const py = Math.sin(angle) * ramp.height / 2;
                    drawMiniStar(ctx, px, py, 8, '#FFD700');
                }
            } else {
                // Draw ramp
                const gradient = ctx.createLinearGradient(0, -ramp.height/2, 0, ramp.height/2);
                gradient.addColorStop(0, ramp.color);
                gradient.addColorStop(1, '#4B0082');

                ctx.fillStyle = gradient;
                ctx.beginPath();

                if (ramp.type === 'up') {
                    ctx.moveTo(-ramp.width/2, ramp.height/2);
                    ctx.lineTo(ramp.width/2, ramp.height/2);
                    ctx.lineTo(ramp.width/2, -ramp.height/2);
                    ctx.quadraticCurveTo(0, -ramp.height/2 - 20, -ramp.width/2, 0);
                } else {
                    ctx.moveTo(-ramp.width/2, -ramp.height/2);
                    ctx.lineTo(ramp.width/2, -ramp.height/2);
                    ctx.lineTo(ramp.width/2, ramp.height/2);
                    ctx.quadraticCurveTo(0, ramp.height/2 + 20, -ramp.width/2, 0);
                }
                ctx.closePath();
                ctx.fill();

                // Add decorative stars
                drawMiniStar(ctx, 0, 0, 12, '#FFD700');
            }

            ctx.restore();
        }

        function drawObstacle(obs, offset) {
            const x = obs.x - offset;
            if (x < -100 || x > canvas.width + 100) return;

            ctx.save();
            ctx.translate(x, obs.y);

            if (obs.type === 'cloud') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(-obs.size * 0.3, 0, obs.size * 0.5, 0, Math.PI * 2);
                ctx.arc(obs.size * 0.3, 0, obs.size * 0.5, 0, Math.PI * 2);
                ctx.arc(0, -obs.size * 0.2, obs.size * 0.6, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Mushroom
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(-obs.size * 0.15, 0, obs.size * 0.3, obs.size * 0.5);

                ctx.fillStyle = '#FF6B6B';
                ctx.beginPath();
                ctx.ellipse(0, 0, obs.size * 0.5, obs.size * 0.35, 0, Math.PI, 0, true);
                ctx.fill();

                // Spots
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(-obs.size * 0.2, -obs.size * 0.15, 5, 0, Math.PI * 2);
                ctx.arc(obs.size * 0.15, -obs.size * 0.1, 4, 0, Math.PI * 2);
                ctx.arc(0, -obs.size * 0.25, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawStar(star, offset) {
            if (star.collected) return;
            const x = star.x - offset;
            if (x < -50 || x > canvas.width + 50) return;

            ctx.save();
            ctx.translate(x, star.y);
            ctx.rotate(star.rotation);

            // Glow
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 20;

            ctx.fillStyle = '#FFD700';
            ctx.strokeStyle = '#FFA500';
            ctx.lineWidth = 2;

            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
                const innerAngle = angle + Math.PI / 5;
                if (i === 0) {
                    ctx.moveTo(Math.cos(angle) * star.size, Math.sin(angle) * star.size);
                } else {
                    ctx.lineTo(Math.cos(angle) * star.size, Math.sin(angle) * star.size);
                }
                ctx.lineTo(Math.cos(innerAngle) * star.size * 0.4, Math.sin(innerAngle) * star.size * 0.4);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function drawBackground() {
            // Gradient sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a0533');
            gradient.addColorStop(0.3, '#4a1259');
            gradient.addColorStop(0.6, '#7b2991');
            gradient.addColorStop(1, '#ff9ecd');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background stars (parallax)
            backgroundStars.forEach(star => {
                const x = (star.x - worldOffset * 0.3) % (canvas.width + 200) - 100;
                star.twinkle += 0.05;
                const alpha = 0.5 + Math.sin(star.twinkle) * 0.5;

                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Ground with flowers
            ctx.fillStyle = '#2d5a27';
            ctx.fillRect(0, canvas.height - 60, canvas.width, 60);

            // Grass tufts and flowers
            for (let i = 0; i < canvas.width; i += 30) {
                const offset = (i + worldOffset * 0.5) % 30;

                // Grass
                ctx.strokeStyle = '#4a8c3f';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(i - offset, canvas.height - 60);
                ctx.quadraticCurveTo(i - offset - 5, canvas.height - 80, i - offset, canvas.height - 70);
                ctx.stroke();

                // Occasional flower
                if (i % 90 === 0) {
                    ctx.fillStyle = `hsl(${(i * 3 + worldOffset) % 360}, 80%, 70%)`;
                    ctx.beginPath();
                    ctx.arc(i - offset + 10, canvas.height - 70, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function update() {
            if (!fairy) return;

            // Handle input
            const flyUp = keys['ArrowUp'] || keys['KeyW'] || keys['up'];
            const flyDown = keys['ArrowDown'] || keys['KeyS'] || keys['down'];
            const flyLeft = keys['ArrowLeft'] || keys['KeyA'] || keys['left'];
            const flyRight = keys['ArrowRight'] || keys['KeyD'] || keys['right'];

            // Flight physics
            if (flyUp) {
                fairy.vy -= 0.5;
                spawnSparkle(fairy.x - 20, fairy.y + 30, '#FFB6C1');
            }
            if (flyDown) fairy.vy += 0.3;
            if (flyLeft) fairy.vx -= 0.3;
            if (flyRight) fairy.vx += 0.3;

            // Gentle gravity
            fairy.vy += 0.15;

            // Air resistance
            fairy.vx *= 0.98;
            fairy.vy *= 0.98;

            // Limit speed
            fairy.vx = Math.max(-8, Math.min(8, fairy.vx));
            fairy.vy = Math.max(-10, Math.min(10, fairy.vy));

            // Move fairy
            fairy.y += fairy.vy;

            // Auto-scroll forward
            worldOffset += 3 + fairy.vx * 0.5;

            // Keep fairy on screen vertically
            if (fairy.y < 50) {
                fairy.y = 50;
                fairy.vy = 0;
            }
            if (fairy.y > canvas.height - 100) {
                fairy.y = canvas.height - 100;
                fairy.vy = 0;
            }

            // Wing animation
            fairy.wingPhase += 0.3;

            // Wing flap sound
            wingTimer++;
            if (wingTimer > 15 && (flyUp || flyDown || flyLeft || flyRight)) {
                playWingFlap();
                wingTimer = 0;
            }

            // Check ramp collisions
            ramps.forEach(ramp => {
                const rx = ramp.x - worldOffset;
                const dist = Math.hypot(fairy.x - rx, fairy.y - ramp.y);

                if (ramp.type === 'ring') {
                    // Flying through ring
                    if (Math.abs(fairy.x - rx) < 30 && Math.abs(fairy.y - ramp.y) < ramp.height / 2 - 10) {
                        if (!ramp.passed) {
                            ramp.passed = true;
                            rampScore++;
                            playRamp();
                            burstSparkles(fairy.x, fairy.y);
                            document.getElementById('score').textContent = `Stars: ${score} | Ramps: ${rampScore}`;
                        }
                    }
                } else {
                    // Ramp boost
                    if (dist < ramp.width / 2 + 30) {
                        if (!ramp.used) {
                            ramp.used = true;
                            rampScore++;
                            playRamp();

                            if (ramp.type === 'up') {
                                fairy.vy = -8;
                            } else {
                                fairy.vy = 6;
                            }
                            burstSparkles(fairy.x, fairy.y);
                            document.getElementById('score').textContent = `Stars: ${score} | Ramps: ${rampScore}`;
                        }
                    }
                }
            });

            // Check star collisions
            stars.forEach(star => {
                if (star.collected) return;
                const sx = star.x - worldOffset;
                const dist = Math.hypot(fairy.x - sx, fairy.y - star.y);

                if (dist < 40) {
                    star.collected = true;
                    score++;
                    playCollect();
                    spawnSparkle(sx, star.y, '#FFD700');
                    document.getElementById('score').textContent = `Stars: ${score} | Ramps: ${rampScore}`;
                }

                star.rotation += 0.03;
            });

            // Update sparkles
            sparkles = sparkles.filter(s => {
                s.x += s.vx;
                s.y += s.vy;
                s.life -= 0.02;
                s.vy += 0.05;
                return s.life > 0;
            });
        }

        function draw() {
            drawBackground();

            // Draw obstacles
            obstacles.forEach(obs => drawObstacle(obs, worldOffset));

            // Draw ramps
            ramps.forEach(ramp => drawRamp(ramp, worldOffset));

            // Draw stars
            stars.forEach(star => drawStar(star, worldOffset));

            // Draw sparkles
            sparkles.forEach(s => {
                ctx.globalAlpha = s.life;
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Draw fairy on dragonfly
            if (fairy && selectedFairy) {
                drawFairyOnDragonfly(ctx, fairy.x, fairy.y, selectedFairy, 1, fairy.wingPhase);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Keyboard controls
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                if (fairy) burstSparkles(fairy.x, fairy.y);
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Mobile controls
        document.querySelectorAll('.mobile-btn').forEach(btn => {
            const key = btn.dataset.key;

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[key] = true;
            });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[key] = false;
            });

            btn.addEventListener('mousedown', () => keys[key] = true);
            btn.addEventListener('mouseup', () => keys[key] = false);
            btn.addEventListener('mouseleave', () => keys[key] = false);
        });

        document.getElementById('magic-btn').addEventListener('click', () => {
            if (fairy) burstSparkles(fairy.x, fairy.y);
        });
        document.getElementById('magic-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (fairy) burstSparkles(fairy.x, fairy.y);
        });
    </script>
</body>
</html>

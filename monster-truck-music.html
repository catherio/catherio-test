<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monster Truck Rally!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #3d8c40;
            min-height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #game-canvas {
            display: block;
            background: #3d8c40;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 50%, #8B4513 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #start-screen h1 {
            color: #FF6B00;
            font-size: 3em;
            text-shadow: 4px 4px 0px #000, -2px -2px 0px #FFD700;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #start-screen p {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #333;
        }

        .truck-picker {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
        }

        .truck-option {
            width: 120px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.3);
        }

        .truck-option:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.6);
        }

        .truck-option canvas {
            width: 100%;
            height: 70px;
        }

        .truck-option span {
            display: block;
            text-align: center;
            font-weight: bold;
            color: #333;
        }

        #score {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 2em;
            color: #FFD700;
            text-shadow: 2px 2px 0 #000;
            z-index: 50;
        }

        #controls-hint {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2em;
            color: #FFF;
            text-shadow: 2px 2px 0 #000;
            z-index: 50;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
        }

        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: none;
        }

        .mobile-btn {
            width: 70px;
            height: 70px;
            font-size: 2em;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            margin: 5px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .mobile-btn:active {
            background: rgba(255,255,255,1);
            transform: scale(0.95);
        }

        .controls-row {
            display: flex;
            justify-content: center;
        }

        #honk-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 50%;
            background: #FF6B00;
            color: white;
            cursor: pointer;
            z-index: 50;
            display: none;
            touch-action: manipulation;
        }

        @media (pointer: coarse) {
            #mobile-controls, #honk-btn {
                display: block;
            }
            #controls-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>MONSTER TRUCK RALLY!</h1>
        <p>Pick your truck!</p>
        <div class="truck-picker" id="truck-picker">
            <!-- Trucks will be added by JS -->
        </div>
    </div>

    <canvas id="game-canvas"></canvas>
    <div id="score">Stars: 0</div>
    <div id="controls-hint">Arrow keys or WASD to drive! Space to honk!</div>

    <div id="mobile-controls">
        <div class="controls-row">
            <button class="mobile-btn" data-key="up">↑</button>
        </div>
        <div class="controls-row">
            <button class="mobile-btn" data-key="left">←</button>
            <button class="mobile-btn" data-key="down">↓</button>
            <button class="mobile-btn" data-key="right">→</button>
        </div>
    </div>
    <button id="honk-btn">HONK!</button>

    <script>
        // Audio setup
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playHonk() {
            initAudio();
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.type = 'square';
            osc1.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(500, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
            osc1.stop(audioCtx.currentTime + 0.4);
            osc2.stop(audioCtx.currentTime + 0.4);
        }

        function playCollect() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playCrash() {
            initAudio();
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            }

            const noise = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();

            noise.buffer = buffer;
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);

            noise.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function playEngine() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(60 + Math.random() * 20, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // Game setup
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const truckColors = [
            { name: 'Red Rocket', body: '#FF4444', cab: '#FF6666' },
            { name: 'Blue Thunder', body: '#4444FF', cab: '#6666FF' },
            { name: 'Green Machine', body: '#44CC44', cab: '#66FF66' },
            { name: 'Yellow Lightning', body: '#DDDD00', cab: '#FFFF44' },
            { name: 'Purple Crusher', body: '#AA44FF', cab: '#CC66FF' },
            { name: 'Orange Blaze', body: '#FF8844', cab: '#FFAA66' },
        ];

        let selectedTruck = null;
        let truck = null;
        let stars = [];
        let obstacles = [];
        let dustParticles = [];
        let score = 0;
        let keys = {};
        let engineTimer = 0;

        // Create truck picker
        const picker = document.getElementById('truck-picker');
        truckColors.forEach((color, index) => {
            const option = document.createElement('div');
            option.className = 'truck-option';

            const miniCanvas = document.createElement('canvas');
            miniCanvas.width = 100;
            miniCanvas.height = 60;
            const miniCtx = miniCanvas.getContext('2d');
            drawTruck(miniCtx, 50, 30, 0, color, 0.5);

            const label = document.createElement('span');
            label.textContent = color.name;

            option.appendChild(miniCanvas);
            option.appendChild(label);
            option.addEventListener('click', () => startGame(index));
            picker.appendChild(option);
        });

        function drawTruck(context, x, y, angle, colors, scale = 1) {
            context.save();
            context.translate(x, y);
            context.rotate(angle);
            context.scale(scale, scale);

            // Shadow
            context.fillStyle = 'rgba(0,0,0,0.3)';
            context.beginPath();
            context.ellipse(0, 35, 50, 15, 0, 0, Math.PI * 2);
            context.fill();

            // Wheels
            const wheelPositions = [[-35, 20], [35, 20]];
            wheelPositions.forEach(([wx, wy]) => {
                context.fillStyle = '#222';
                context.beginPath();
                context.arc(wx, wy, 22, 0, Math.PI * 2);
                context.fill();

                context.fillStyle = '#444';
                context.beginPath();
                context.arc(wx, wy, 18, 0, Math.PI * 2);
                context.fill();

                context.fillStyle = '#888';
                context.beginPath();
                context.arc(wx, wy, 8, 0, Math.PI * 2);
                context.fill();
            });

            // Truck body
            context.fillStyle = colors.body;
            context.beginPath();
            context.roundRect(-45, -15, 90, 40, 10);
            context.fill();

            // Cab
            context.fillStyle = colors.cab;
            context.beginPath();
            context.roundRect(-25, -35, 40, 25, [10, 10, 0, 0]);
            context.fill();

            // Window
            context.fillStyle = '#87CEEB';
            context.beginPath();
            context.roundRect(-18, -30, 26, 15, [5, 5, 0, 0]);
            context.fill();

            // Headlights
            context.fillStyle = '#FFFF00';
            context.beginPath();
            context.arc(40, 5, 6, 0, Math.PI * 2);
            context.fill();

            context.restore();
        }

        function startGame(truckIndex) {
            initAudio();
            selectedTruck = truckColors[truckIndex];
            document.getElementById('start-screen').style.display = 'none';

            truck = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                angle: 0,
                speed: 0,
                maxSpeed: 8,
                acceleration: 0.3,
                turnSpeed: 0.05,
                friction: 0.98
            };

            // Create initial stars
            for (let i = 0; i < 10; i++) {
                spawnStar();
            }

            // Create obstacles (mud puddles and rocks)
            for (let i = 0; i < 8; i++) {
                spawnObstacle();
            }

            gameLoop();
        }

        function spawnStar() {
            stars.push({
                x: Math.random() * (canvas.width - 100) + 50,
                y: Math.random() * (canvas.height - 100) + 50,
                size: 20 + Math.random() * 15,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: 0.02 + Math.random() * 0.02
            });
        }

        function spawnObstacle() {
            const type = Math.random() > 0.5 ? 'mud' : 'rock';
            obstacles.push({
                x: Math.random() * (canvas.width - 100) + 50,
                y: Math.random() * (canvas.height - 100) + 50,
                size: 30 + Math.random() * 30,
                type: type
            });
        }

        function drawStar(x, y, size, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);

            ctx.fillStyle = '#FFD700';
            ctx.strokeStyle = '#FFA500';
            ctx.lineWidth = 3;

            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
                const innerAngle = angle + Math.PI / 5;

                if (i === 0) {
                    ctx.moveTo(Math.cos(angle) * size, Math.sin(angle) * size);
                } else {
                    ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
                }
                ctx.lineTo(Math.cos(innerAngle) * size * 0.4, Math.sin(innerAngle) * size * 0.4);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function drawObstacle(obs) {
            ctx.save();
            ctx.translate(obs.x, obs.y);

            if (obs.type === 'mud') {
                ctx.fillStyle = '#5D4037';
                ctx.beginPath();
                ctx.ellipse(0, 0, obs.size, obs.size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#4E342E';
                ctx.beginPath();
                ctx.ellipse(-5, -5, obs.size * 0.3, obs.size * 0.2, 0.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#757575';
                ctx.beginPath();
                ctx.moveTo(-obs.size * 0.5, obs.size * 0.3);
                ctx.lineTo(-obs.size * 0.2, -obs.size * 0.4);
                ctx.lineTo(obs.size * 0.3, -obs.size * 0.3);
                ctx.lineTo(obs.size * 0.5, obs.size * 0.2);
                ctx.lineTo(0, obs.size * 0.4);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#9E9E9E';
                ctx.beginPath();
                ctx.moveTo(-obs.size * 0.2, -obs.size * 0.4);
                ctx.lineTo(0, -obs.size * 0.2);
                ctx.lineTo(obs.size * 0.1, -obs.size * 0.3);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        function spawnDust(x, y, angle) {
            for (let i = 0; i < 3; i++) {
                dustParticles.push({
                    x: x - Math.cos(angle) * 40 + (Math.random() - 0.5) * 20,
                    y: y - Math.sin(angle) * 40 + (Math.random() - 0.5) * 20,
                    size: 10 + Math.random() * 10,
                    life: 1,
                    vx: -Math.cos(angle) * 2 + (Math.random() - 0.5) * 2,
                    vy: -Math.sin(angle) * 2 + (Math.random() - 0.5) * 2
                });
            }
        }

        function updateDust() {
            dustParticles = dustParticles.filter(d => {
                d.x += d.vx;
                d.y += d.vy;
                d.life -= 0.03;
                d.size *= 1.02;
                return d.life > 0;
            });
        }

        function drawDust() {
            dustParticles.forEach(d => {
                ctx.fillStyle = `rgba(139, 69, 19, ${d.life * 0.5})`;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawGround() {
            // Grass background
            ctx.fillStyle = '#3d8c40';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dirt track marks (decorative)
            ctx.strokeStyle = '#5D4037';
            ctx.lineWidth = 40;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(100, 100);
            ctx.quadraticCurveTo(canvas.width / 2, 200, canvas.width - 100, 150);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(150, canvas.height - 100);
            ctx.quadraticCurveTo(canvas.width / 2, canvas.height - 250, canvas.width - 150, canvas.height - 80);
            ctx.stroke();
        }

        function update() {
            if (!truck) return;

            // Handle input
            let accelerating = keys['ArrowUp'] || keys['KeyW'] || keys['up'];
            let braking = keys['ArrowDown'] || keys['KeyS'] || keys['down'];
            let turningLeft = keys['ArrowLeft'] || keys['KeyA'] || keys['left'];
            let turningRight = keys['ArrowRight'] || keys['KeyD'] || keys['right'];

            // Acceleration
            if (accelerating) {
                truck.speed = Math.min(truck.speed + truck.acceleration, truck.maxSpeed);
            } else if (braking) {
                truck.speed = Math.max(truck.speed - truck.acceleration, -truck.maxSpeed / 2);
            }

            // Friction
            truck.speed *= truck.friction;

            // Turning (only when moving)
            if (Math.abs(truck.speed) > 0.5) {
                if (turningLeft) {
                    truck.angle -= truck.turnSpeed * (truck.speed > 0 ? 1 : -1);
                }
                if (turningRight) {
                    truck.angle += truck.turnSpeed * (truck.speed > 0 ? 1 : -1);
                }
            }

            // Move truck
            truck.x += Math.cos(truck.angle) * truck.speed;
            truck.y += Math.sin(truck.angle) * truck.speed;

            // Wrap around screen
            if (truck.x < -50) truck.x = canvas.width + 50;
            if (truck.x > canvas.width + 50) truck.x = -50;
            if (truck.y < -50) truck.y = canvas.height + 50;
            if (truck.y > canvas.height + 50) truck.y = -50;

            // Dust when moving
            if (Math.abs(truck.speed) > 2) {
                spawnDust(truck.x, truck.y, truck.angle);

                engineTimer++;
                if (engineTimer > 10) {
                    playEngine();
                    engineTimer = 0;
                }
            }

            // Check star collisions
            stars = stars.filter(star => {
                const dist = Math.hypot(truck.x - star.x, truck.y - star.y);
                if (dist < 50) {
                    score++;
                    document.getElementById('score').textContent = `Stars: ${score}`;
                    playCollect();
                    spawnStar();
                    return false;
                }
                star.rotation += star.rotationSpeed;
                return true;
            });

            // Check obstacle collisions
            obstacles.forEach(obs => {
                const dist = Math.hypot(truck.x - obs.x, truck.y - obs.y);
                if (dist < obs.size + 30 && Math.abs(truck.speed) > 3) {
                    if (obs.type === 'mud') {
                        truck.speed *= 0.5;
                    } else {
                        truck.speed *= -0.3;
                        playCrash();
                    }
                }
            });

            updateDust();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGround();

            // Draw obstacles
            obstacles.forEach(drawObstacle);

            // Draw stars
            stars.forEach(star => {
                drawStar(star.x, star.y, star.size, star.rotation);
            });

            // Draw dust
            drawDust();

            // Draw truck
            if (truck && selectedTruck) {
                drawTruck(ctx, truck.x, truck.y, truck.angle, selectedTruck, 1);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Keyboard controls
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                playHonk();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Mobile controls
        document.querySelectorAll('.mobile-btn').forEach(btn => {
            const key = btn.dataset.key;

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[key] = true;
            });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[key] = false;
            });

            btn.addEventListener('mousedown', () => keys[key] = true);
            btn.addEventListener('mouseup', () => keys[key] = false);
            btn.addEventListener('mouseleave', () => keys[key] = false);
        });

        document.getElementById('honk-btn').addEventListener('click', playHonk);
        document.getElementById('honk-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            playHonk();
        });
    </script>
</body>
</html>
